  gap: >-
    49 of 65 operations declare a 200 response and nothing else - no 400, no 401,
    no 404, no 5xx - even though every operation is authenticated and therefore
    can return the observed 401. No 5xx response is declared anywhere in the
    specification. A client generated from this contract will have no typed
    handling for the most common failure it will actually hit.
