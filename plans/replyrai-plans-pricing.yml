note: >-
  Replyr publishes no pricing tiers. The homepage carries a #pricing anchor, but
  the section behind it is a "Qualify My Clinic" lead-capture form (name, clinic
  name, Malaysian phone number, optional email, role, a monthly-revenue band
  selector, and interest checkboxes for AI Chat / Advertising / BookAClinic /
  Content & Podcast / a February promo), closing with "No lock-in contracts.
  Results-focused." There is no price, no tier, no quota and no published billing
  period anywhere on the site or in the operator console, and the console has no
  public sign-up route - https://app.replyr.ai/en/register returns 404 and the
  only entry point is a login. Pricing is a sales conversation.
  The Ringgit figures that appear on the marketing site (RM12 and RM18 cost per
  lead, RM299 and RM1,200 treatment prices, RM328,150 revenue generated) are
  case-study and demo-chat copy describing clinic economics, NOT Replyr's own
  prices, and are deliberately not recorded as plans.
  One machine-readable pricing signal does exist but is not resolvable: the
  Account object returned by GET /accounts/me carries an integer `plan` field,
  and no plan catalog is published to translate that integer into a tier name,
  price or entitlement.
