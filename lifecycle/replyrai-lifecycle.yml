note: >-
  Replyr publishes no versioning policy, no deprecation policy, no SLA, no status
  page and no changelog. This file records those absences with the URLs probed,
  so no StatusPage and no Deprecation pointer is wired in apis.yml. The spec's
  info.version is the only version signal published anywhere.

