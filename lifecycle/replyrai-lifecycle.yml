  detail: >-
    host is app.replyr.ai/api with basePath / and no version segment. The Swagger
    document declares info.version 1.1 and the Swagger UI loads its JSON with a
    ?v=22 cache-buster, but neither is addressable by a client - there is no way
    to pin a version when calling the API.

