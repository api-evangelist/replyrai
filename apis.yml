name: Replyr.ai
description: >-
  Replyr.ai (Replyr Sdn Bhd, Kuala Lumpur, Malaysia) is an AI-powered customer
  engagement and patient-acquisition platform aimed at Malaysian clinics. It
  builds GPT-style chat assistants that reply instantly in multiple languages
  across WhatsApp, Instagram, Facebook Messenger and other chat channels to
  qualify leads, answer FAQs, recommend products and book appointments 24/7, and
  packages that with Meta and Google advertising campaigns and a BookAClinic
  discovery marketplace. The operator console at app.replyr.ai runs a
  white-labeled deployment of the ChatRace conversational-commerce platform and
  exposes a REST API of its own at https://app.replyr.ai/api, documented with a
  live Swagger UI and a Swagger 2.0 specification covering accounts, contacts,
  tags and custom fields, message sending across channels, sales pipelines and
  opportunities, AI agents, appointment calendars, templates and an ecommerce
  cart/order surface. Authentication is a single X-ACCESS-TOKEN API key header.
  Surfaced as a 500 Global portfolio company.
