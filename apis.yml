apis:
- name: Replyr Platform API
  description: >-
    REST API for the Replyr operator console at app.replyr.ai. Covers business
    account details, admins and teams, tags, custom fields and bot fields,
    contacts (create, look up, tag, set fields), outbound messaging across the
    connected chat channels (text, file, product, flow and multi-action
    send_content), sales pipelines with stages, opportunities and comments, AI
    agents with their functions, files and configured MCP connections,
    appointment calendars, template installation, and an ecommerce cart, order
    and product surface. Authenticated with a single X-ACCESS-TOKEN API key
    header issued from the console.
